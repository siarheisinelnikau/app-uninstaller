name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Check and test inert fixtures
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Package without execution or publication
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Retain review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppUninstaller-review-build
          path: dist/*

  localization-release:
    name: Publish the explicitly requested localization release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: AppUninstaller-review-build
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
