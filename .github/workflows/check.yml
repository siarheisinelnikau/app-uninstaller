name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Check and test inert fixtures
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Package without execution or publication
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Retain review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppUninstaller-review-build
          path: dist/*
