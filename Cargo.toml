[package]
name = "app-uninstaller"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Windows application removal with explainable, reversible leftover review"
repository = "https://github.com/siarheisinelnikau/app-uninstaller"

[dependencies]
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
anyhow = "1.0.104"
egui = { version = "=0.33.3", features = ["default_fonts", "accesskit"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links", "accesskit"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "AppUninstaller"
path = "src/main.rs"

[profile.release]
strip = "debuginfo"

[profile.dev]
incremental = false

[profile.test]
incremental = false

